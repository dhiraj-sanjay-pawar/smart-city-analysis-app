name: smart_city_app
description: "Smart City Citizen App — Integrated Smart City Analytics Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking & API
  http: ^1.2.2
  dio: ^5.7.0

  # Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Navigation
  go_router: ^15.1.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
